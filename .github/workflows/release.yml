# Cut a release:
#   set <Version> in companion/DiceyA11y.csproj, commit, then
#   git tag v1.2.3 && git push --follow-tags
#
# Unlike the Unity mods, everything here builds without the game: the launcher is plain
# .NET, and the bridge is built from bridge/lime_exports.txt (export names only).
# "Run workflow" by hand builds the same zip as an artifact without releasing anything.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRISM_VERSION: v0.18.2
  PRISM_SHA256: 31C02E3EF2260B4D3B11FB00132F8EB12BC147B5FB17031B580670B117BA7D23

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Check the tag against the version in the csproj
        if: github.ref_type == 'tag'
        run: |
          $version = ([xml](Get-Content companion/DiceyA11y.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in companion/DiceyA11y.csproj."
          }

      - name: Download Prism
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:PRISM_VERSION --repo ethindp/prism --pattern prism-windows-x64.zip --dir $env:RUNNER_TEMP
          $zip = Join-Path $env:RUNNER_TEMP prism-windows-x64.zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:PRISM_SHA256) { throw "prism-windows-x64.zip has SHA256 $hash, expected $env:PRISM_SHA256." }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP prism)

      - name: Install pandoc
        run: choco install pandoc -y --no-progress

      - name: Build and package
        run: |
          $env:PATH += ";C:\Program Files\Pandoc;$env:LOCALAPPDATA\Pandoc"
          ./tools/package_release.ps1 -GameDir (Join-Path $env:RUNNER_TEMP no-game) -PrismDir (Join-Path $env:RUNNER_TEMP prism)

      - name: Check that the payload and the installer are there
        run: |
          $zip = Get-Item DiceyA11y-v*.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          foreach ($f in 'DiceyA11y/DiceyA11y.exe', 'DiceyA11y/DiceyA11y.dll', 'DiceyA11y/prism.dll', 'DiceyA11y/bridge/lime.ndll', 'DiceyA11y/readme.html') {
            if ($names -notcontains $f) { throw "$f is missing from $($zip.Name)" }
          }
          $bridge = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("release/DiceyA11y/bridge/lime.ndll"))
          if (-not $bridge.Contains("diceya11y_bridge_marker")) { throw "The bridge has no marker export; installers would refuse it." }
          if (-not (Test-Path installer/DiceyDungeonsAccessibilityInstaller.exe)) { throw "installer exe missing" }

      - uses: actions/upload-artifact@v7
        with:
          name: DiceyA11y
          path: DiceyA11y-v*.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiceyA11y-v*.zip
            installer/DiceyDungeonsAccessibilityInstaller.exe
          generate_release_notes: true
